# ============================================================================
# config.yaml — TẤT CẢ ngưỡng và tham số của hệ thống nằm ở đây.
# Không hardcode số trong code. Sửa file này để hiệu chỉnh hành vi hệ thống.
# ============================================================================

camera:
  device_index: 0
  target_fps: 15          # fps mục tiêu; capture luôn dùng timestamp thực, không giả định fps ổn định
  width: 640
  height: 480
  preview_window: true    # hiển thị cửa sổ preview với EAR/MAR/pitch realtime

landmark:
  model_path: "models/face_landmarker.task"
  num_faces: 1
  min_face_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_tracking_confidence: 0.5

# ----------------------------------------------------------------------------
# Lớp 1 — Phản xạ (< 1s, offline, còi cabin)
# ----------------------------------------------------------------------------
layer1:
  nguong_ear: 0.21               # (v1, giữ tương thích ngược) EAR dưới ngưỡng này = mắt "nhắm" — chỉ dùng làm
                                  # fallback vao=ra khi KHÔNG cấu hình nguong_hysteresis bên dưới
  nguong_nham_mat_giay: 1.2      # giá trị mặc định (mức nền "binh_thuong"); Lớp 3 có thể hạ xuống runtime
  chop_mat_toi_da_giay: 0.5      # dưới ngưỡng này KHÔNG tính là nhắm mắt kéo dài (chớp mắt bình thường)
  canh_bao_do_tre_ms: 300        # in cảnh báo nếu latency vượt mốc này

# ----------------------------------------------------------------------------
# v2 — Nguồn tín hiệu trạng thái mắt (item 1 + item 4): ear | blendshape | hybrid | onnx
# ----------------------------------------------------------------------------
nguon_tin_hieu:
  mat: ear              # mặc định "ear" để giữ ĐÚNG hành vi v1; đổi "hybrid" để bật chống báo giả 2 nguồn
  mieng: mar             # mar | jawopen | hybrid (móc nối cho GĐ sau; hiện tại MAR vẫn là nguồn Lớp 2 dùng)
  bat_dong_toi_thieu_giay: 0.5   # hai nguồn (hybrid) bất đồng liên tục >= khoảng này -> ghi bat_dong_nguon.jsonl
  duong_dan_bat_dong_log: "data/bat_dong_nguon.jsonl"

nguong_blendshape:
  blink_nham: 0.5        # mean(eyeBlinkLeft, eyeBlinkRight) > giá trị này = nhắm (tài liệu tham khảo v1-style;
                          # ngưỡng runtime thật có hysteresis nằm ở nguong_hysteresis bên dưới)
  jawopen_ngap: 0.5

# Hysteresis: ngưỡng VÀO nhắm và RA nhắm khác nhau -> chống rung khi tín hiệu dao động quanh 1 ngưỡng.
# KHÔNG có mục này (config v1 cũ) -> tự dùng layer1.nguong_ear cho cả vao/ra (không hysteresis, đúng hành vi v1).
nguong_hysteresis:
  ear_vao: 0.19           # EAR tụt dưới mức này -> bắt đầu tính "nhắm"
  ear_ra: 0.23            # EAR vượt lên trên mức này -> tính "mở" lại (vùng chết 0.19-0.23 chống rung)
  blendshape_vao: 0.55    # blink blendshape vượt lên trên mức này -> "nhắm"
  blendshape_ra: 0.45     # blink blendshape tụt xuống dưới mức này -> "mở"

# Móc nối GĐ1: model ONNX phân loại mắt mở/nhắm (vd open-closed-eye-0001, hoặc model fine-tune sau này).
nguon_onnx:
  duong_dan_model: "models/eye_state.onnx"   # không tồn tại -> nguồn 'onnx' tự vô hiệu hoá, không crash
  nguong_vao: 0.5
  nguong_ra: 0.5

# Coverage (item 3) + mất landmark (item 7)
coverage:
  khong_kha_dung_giay: 2.0   # mất landmark liên tục >= khoảng này -> sự kiện "khong_kha_dung" (KHÔNG phải cảnh báo)

mat_mat_landmark:
  toi_da_giu_chuoi_giay: 1.5     # mất landmark <= khoảng này giữa chuỗi nhắm mắt -> KHÔNG reset bộ đếm Lớp 1
  nguong_pitch_chui_do: 20       # pitch >= mức này NGAY TRƯỚC khi mất mặt -> phát sự kiện mat_mat_sau_chui_dau

frame_log:
  bat: false                          # bật/tắt ghi frame-log JSONL để phân tích offline
  sampling: 5                         # ghi 1/N frame (giảm phình đĩa)
  duong_dan: "data/frame_log.jsonl"

# Calibration theo từng tài xế (item 2) — python -m edge.calibrate --tai-xe-id <id>
calibration:
  thoi_gian_mo_giay: 10
  thoi_gian_nham_giay: 5
  bien_do_toi_thieu_ear: 0.02          # percentile5(mở) - percentile95(nhắm) phải >= mức này mới coi là tách được
  bien_do_toi_thieu_blendshape: 0.05
  do_rong_bang_ear: 0.02               # nửa băng hysteresis áp quanh ngưỡng cá nhân đã hiệu chỉnh
  do_rong_bang_blendshape: 0.05
  thu_muc_profile: "profiles"

session_report:
  thu_muc: "reports/sessions"

buzzer:
  # thư viện ưu tiên thử theo thứ tự; nếu tất cả lỗi thì fallback in cảnh báo console
  thu_vien_uu_tien: ["sounddevice", "simpleaudio", "pygame"]
  tan_so_hz: 1000
  thoi_luong_giay: 0.35
  bien_do: 0.5

# ----------------------------------------------------------------------------
# Lớp 2 — Xu hướng (10-60s, mức cảnh báo 0-3, gửi trung tâm)
# ----------------------------------------------------------------------------
layer2:
  perclos:
    cua_so_giay: 60
    nguong_perclos_cao: 0.35     # PERCLOS >= mốc này -> quy tắc cứng: tối thiểu mức 2 (mức nền binh_thuong)

  ngap:
    nguong_mar: 0.55             # MAR trên ngưỡng này = miệng "mở" (ngáp)
    nguong_ngap_giay: 1.5        # phải giữ liên tục >= khoảng này mới tính 1 sự kiện ngáp
    debounce_giay: 3.0           # 2 sự kiện ngáp phải cách nhau >= khoảng này
    cua_so_phut: 3               # chỉ số ngáp/phút tính trên cửa sổ trượt này

  gat_dau:
    nguong_pitch_do: 20          # pitch chúi xuống vượt ngưỡng này bắt đầu tính là "gật"
    hoi_phuc_toi_da_giay: 2.0    # phải hồi phục (pitch < ngưỡng) trong khoảng này mới tính 1 sự kiện gật
    cua_so_phut: 3               # chỉ số gật/phút tính trên cửa sổ trượt này
    dao_dau_pitch: false         # đảo dấu pitch nếu camera/model cho chiều ngược (hiệu chỉnh theo thiết bị)

  noisy_or:
    # risk = 1 - PRODUCT(1 - w_i * x_i), x_i trong [0,1]
    trong_so:
      perclos: 0.9                # w cho cờ PERCLOS vượt ngưỡng cảnh báo theo mức nền
      ngap_phut: 0.6               # w cho chỉ số ngáp/phút (chuẩn hoá theo nguong_ngap_phut_max)
      gat_phut: 0.7                # w cho chỉ số gật/phút (chuẩn hoá theo nguong_gat_phut_max)
      layer1_gan_day: 0.8          # w cho cờ có sự kiện Lớp 1 trong cua_so_layer1_giay giây gần nhất
    chuan_hoa:
      nguong_ngap_phut_max: 3      # ngap_phut / giá trị này, clip về [0,1]
      nguong_gat_phut_max: 4       # gat_phut / giá trị này, clip về [0,1]
      cua_so_layer1_giay: 90       # sự kiện Lớp 1 trong bao nhiêu giây gần nhất thì tính là "gần đây"

    # map risk (0..1) -> mức cảnh báo 0/1/2/3, dùng ngưỡng dưới (risk >= nguong -> mức đó)
    muc_theo_risk:
      - { muc: 3, nguong: 0.75 }
      - { muc: 2, nguong: 0.5 }
      - { muc: 1, nguong: 0.25 }
      - { muc: 0, nguong: 0.0 }

  anh_minh_chung:
    muc_toi_thieu_de_chup: 2
    thu_muc_luu: "data/evidence"

# ----------------------------------------------------------------------------
# Lớp 3 — Hook bối cảnh (hệ số rủi ro nền)
# ----------------------------------------------------------------------------
layer3:
  poll_giay: 5
  # File cục bộ TRÊN MÁY EDGE, do chính edge tự ghi lại mỗi lần đọc server thành
  # công — dùng làm cache/fallback khi mất mạng. Khác với server.context_file
  # (nơi server lưu giá trị dashboard chỉnh) để hai lớp "nguồn" độc lập nhau.
  file_fallback: "data/context_cache_edge.json"
  server_endpoint: "/api/context"
  muc_mac_dinh: "binh_thuong"

  nguong_theo_muc_nen:
    binh_thuong: { nham_mat_giay: 1.2, perclos_canh_bao: 0.35 }
    cao:         { nham_mat_giay: 0.8, perclos_canh_bao: 0.28 }

# ----------------------------------------------------------------------------
# Alert policy — chống spam theo loại cảnh báo
# ----------------------------------------------------------------------------
alert_policy:
  cooldown_giay:
    layer1_buzzer: 5
    layer2_event: 30    # cùng mức không lặp lại trong khoảng này

# ----------------------------------------------------------------------------
# Uplink — gửi event về server (fire-and-forget)
# ----------------------------------------------------------------------------
uplink:
  server_url: "http://127.0.0.1:8000"
  event_endpoint: "/api/event"       # sự kiện mức >= 2, kèm ảnh minh chứng
  telemetry_endpoint: "/api/telemetry"  # nhịp đo định kỳ NHẸ (không ảnh) để vẽ đồ thị PERCLOS trên dashboard
  telemetry_interval_giay: 2
  timeout_giay: 1.5
  xe_id: "demo-xe-01"
  tai_xe_id: "demo-tai-xe-01"

# ----------------------------------------------------------------------------
# Server
# ----------------------------------------------------------------------------
server:
  host: "127.0.0.1"
  port: 8000
  db_path: "data/events.db"
  context_file: "data/context_level.json"
