name: Frontend CI / Build Check

on:
  push:
    branches: [ "main", "master", "cheese" ]
  pull_request:
    branches: [ "main", "master", "cheese" ]

jobs:
  build-and-check:
    name: Web CI / build & check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Verify Production Build
        run: npm run build
